    <linearGradient id="topV" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#33382F"/>
      <stop offset="1" stop-color="#22261F"/>
    </linearGradient>
    <linearGradient id="frontV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20251E"/>
      <stop offset="1" stop-color="#141713"/>
    </linearGradient>
    <linearGradient id="sideV" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#262B23"/>
      <stop offset="1" stop-color="#171B15"/>
    </linearGradient>
    <pattern id="grilleV" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#C08A4E" stroke-width="1.4" opacity="0.6"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#8E5F33" stroke-width="0.7" opacity="0.35"/>
    </pattern>
    <filter id="softV" x="-50%" y="-100%" width="200%" height="300%">
