<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" width="900" height="1100" role="img" aria-label="An illustration of a compact DGX-Spark-class AI supercomputer in a sunlit AI factory, with a knowledge graph of agent nodes above it.">
  <defs>
    <linearGradient id="paperV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8F3E7"/>
      <stop offset="0.6" stop-color="#EFE9DA"/>
      <stop offset="1" stop-color="#E6DFCE"/>
    </linearGradient>
    <radialGradient id="sunV" cx="0.76" cy="0.02" r="0.7">
      <stop offset="0" stop-color="#FFF7E2" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#FFF3D8" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#FFF3D8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nodeGlowV" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#C08A4E" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="#C08A4E" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#C08A4E" stop-opacity="0"/>
